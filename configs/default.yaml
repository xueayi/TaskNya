generic_webhook:
  anime_quote_enabled: true
  body: "{\n  \"content\": \"[ ${project_name} ]\\n----------------------------\\\
    n触发方式: ${method}\\n触发详情: ${detail}\\n----------------------------\\n[ 数据统计 ]\\\
    n报告统计: ${report_summary}\\n变更列表: ${report_change_list}\\n提示: ${report_actions}\\\
    n----------------------------\\n详情查看: xxxxxxxxx\\n\\n${anime_quote}\\n[ 来自 TaskNya\
    \ 推送 ]\",\n  \"umo\": \"xxxxxxxxx:GroupMessage:xxxxxxxxx\",\n  \"message_type\"\
    : \"text\"\n}"
  enabled: true
  headers:
    Authorization: Bearer xxxxxxxxx
    Content-Type: application/json
  method: POST
  retry_count: 3
  timeout: 10
  url: xxxxxxxxx
